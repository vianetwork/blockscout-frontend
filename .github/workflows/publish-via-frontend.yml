name: Publish Via frontend

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed main commit to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-via-frontend-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Via frontend
    if: github.repository == 'vianetwork/blockscout-frontend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_REPOSITORY: docker.io/vianetwork/blockscout-frontend
      BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - name: Check publication prerequisites
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase commit SHA is required'; exit 1; }
          [[ -n "$DOCKERHUB_USER" && -n "$DOCKERHUB_TOKEN" ]] || {
            echo 'Provision DOCKERHUB_USER and DOCKERHUB_TOKEN in repository Actions secrets'; exit 1;
          }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merged source and derive image identity
        id: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          version=$(jq -er '.version' package.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="$IMAGE_REPOSITORY:$version-via-${SOURCE_SHA:0:12}-$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          printf 'version=%s\nimage=%s\nshort_sha=%s\n' "$version" "$image" "${SOURCE_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build reviewed frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.source.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/vianetwork/blockscout-frontend
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.url=${{ env.BUILD_URL }}
            io.vianetwork.build.workflow-revision=${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ steps.source.outputs.short_sha }}
            GIT_REPOSITORY_URL=https://github.com/vianetwork/blockscout-frontend

      - name: Smoke check the packaged frontend
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = amd64
          test "$(docker image inspect --format '{{.Os}}' "$IMAGE")" = linux
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$SOURCE_SHA"
          docker run --rm --network none --entrypoint sh -e SHORT_SHA "$IMAGE" -ec '
            test -s server.js
            test -s .next/BUILD_ID
            test -d .next/static
            test -x entrypoint.sh
            test -x validate_envs.sh
            test -x make_envs_script.sh
            test -s envs-validator/index.js
            grep -Fx "NEXT_PUBLIC_GIT_COMMIT_SHA=$SHORT_SHA" .env
            grep -Fx "NEXT_PUBLIC_GIT_REPOSITORY_URL=https://github.com/vianetwork/blockscout-frontend" .env
            for key in NEXT_PUBLIC_ROLLUP_TYPE NEXT_PUBLIC_ROLLUP_PARENT_CHAIN NEXT_PUBLIC_AD_BANNER_PROVIDER NEXT_PUBLIC_AD_TEXT_PROVIDER; do
              grep -q "^$key=" .env.registry
            done
            node --check server.js
          '

      - name: Authenticate to Via Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish and verify the registry digest
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          docker push "$IMAGE"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          digest="${reference##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          pinned="$IMAGE_REPOSITORY@$digest"
          docker buildx imagetools inspect "$pinned"
          docker pull "$pinned"
          test "$(docker image inspect --format '{{.Architecture}}' "$pinned")" = amd64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$pinned")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$pinned")" = https://github.com/vianetwork/blockscout-frontend
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$pinned")" = "$VERSION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.url"}}' "$pinned")" = "$BUILD_URL"
          test "$(docker image inspect --format '{{index .Config.Labels "io.vianetwork.build.workflow-revision"}}' "$pinned")" = "$GITHUB_SHA"
          {
            printf 'Source: %s\n\n' "$SOURCE_SHA"
            printf 'Workflow revision: %s\n\n' "$GITHUB_SHA"
            printf 'Build: %s\n\n' "$BUILD_URL"
            printf 'Image: %s\n\n' "$IMAGE"
            printf 'Digest pin: %s\n\n' "$pinned"
            printf 'Platform: linux/amd64. Packaging smoke passed.\n\n'
            printf 'Runtime validation, desktop/mobile browser checks, and an approved infrastructure digest pin remain deployment gates.\n'
          } >> "$GITHUB_STEP_SUMMARY"
